[package]
name = "blackwater"
version = "1.0.0"
edition = "2021"
authors = ["Blackwater Developers"]
description = "Private, offline-first RDR2 photo extraction and conversion utility"
readme = "README.md"
license = "MIT"

[dependencies]
eframe = { version = "0.28", default-features = false, features = ["default_fonts", "glow"] }
egui = "0.28"
egui_extras = { version = "0.28", features = ["image"] }
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
zip = { version = "2.1", default-features = false, features = ["deflate"] }
rfd = "0.14"
crossbeam-channel = "0.5"
walkdir = "2.5"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
dirs = "5.0"
thiserror = "2.0"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_System_ProcessStatus",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_Foundation",
] }

[dev-dependencies]
tempfile = "3.10"
